apiVersion: apps/v1
kind: Deployment
metadata:
  name: txn-web
  labels:
    app.kubernetes.io/name: txn-web
  annotations:
    checkov.io/skip1: CKV_K8S_15=Imagen fijada por digest; IfNotPresent evita pulls redundantes y rate limits del registry.
spec:
  # Sin "replicas": el HPA es el dueño del número de réplicas (un apply no lo resetea).
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: txn-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: txn-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # HA: reparte réplicas entre AZs y entre nodos.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: txn-web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: txn-web
      containers:
        - name: nginx
          # Tag legible + digest inmutable: el mismo artefacto se promueve entre entornos.
          image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            # Da tiempo al ALB a desregistrar el target antes de cortar conexiones.
            preStop:
              sleep:
                seconds: 10
          securityContext:
            runAsUser: 10101
            runAsGroup: 10101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-templates
          configMap:
            name: txn-web-nginx
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
