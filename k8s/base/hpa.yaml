apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: txn-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: txn-web
  minReplicas: 3 # una réplica por AZ como mínimo
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      # Más corto que el default (300s) para que la demo muestre el scale-in.
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
