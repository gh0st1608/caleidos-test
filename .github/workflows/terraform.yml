# Push a main con cambios en infra/: plan -> aprobación manual (Environment "dev") -> apply del mismo plan.
name: terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC hacia AWS, sin access keys

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK_DIR: infra/live/dev/us-east-1/platform
  # El rol de plan necesita leer el cluster (helm_release) -> access entry de solo lectura.
  TF_VAR_eks_viewer_principal_arns: '["${{ vars.AWS_PLAN_ROLE_ARN }}"]'
  # Solo si el cluster lo creó otro principal (p. ej. tu laptop); vacío = []
  TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      has-changes: ${{ steps.plan.outputs.exitcode == '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }} # solo lectura
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.0"
          terraform_wrapper: false

      - name: init
        run: terraform -chdir="${STACK_DIR}" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: plan
        id: plan
        run: |
          set +e
          terraform -chdir="${STACK_DIR}" plan -detailed-exitcode -lock-timeout=5m -out=tfplan
          ec=$?
          echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
          [ "${ec}" -ne 1 ]

      # El plan queda visible en el resumen del run para revisarlo antes de aprobar.
      - name: summary
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform -chdir="${STACK_DIR}" show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.exitcode == '2'
        with:
          name: tfplan
          path: ${{ env.STACK_DIR }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    environment: dev # requiere aprobación de un reviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.0"
          terraform_wrapper: false

      - name: init
        run: terraform -chdir="${STACK_DIR}" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.STACK_DIR }}

      # Se aplica exactamente el plan revisado; si el state cambió, Terraform lo rechaza.
      - name: apply
        run: terraform -chdir="${STACK_DIR}" apply -lock-timeout=5m tfplan
