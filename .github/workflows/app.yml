# Despliegue de la app: push a main con cambios en k8s/, o tras un run exitoso de "terraform".
name: app

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/app.yml'
  workflow_run:
    workflows: [terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-dev
  cancel-in-progress: false

env:
  CLUSTER_NAME: acme-txn-dev
  NAMESPACE: acme-txn
  APP: txn-web

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${{ vars.AWS_REGION }}"

      - name: deploy
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl -n "${NAMESPACE}" rollout status "deployment/${APP}" --timeout=300s

      - name: smoke test (vía ALB)
        id: smoke
        run: |
          for _ in $(seq 1 60); do
            host="$(kubectl -n "${NAMESPACE}" get ingress "${APP}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            [ -n "${host}" ] && break
            sleep 5
          done
          [ -n "${host}" ] || { echo "::error::Ingress sin hostname"; exit 1; }
          echo "url=http://${host}" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 36); do
            curl -fsS --max-time 5 "http://${host}/whoami" && exit 0
            sleep 10
          done
          echo "::error::Smoke test fallido contra http://${host}"
          exit 1

      - name: rollback
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" rollout undo "deployment/${APP}" || true
          kubectl -n "${NAMESPACE}" rollout status "deployment/${APP}" --timeout=300s || true
